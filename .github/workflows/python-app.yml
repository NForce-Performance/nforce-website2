# Controle bij elke push en pull request: de site bouwt zonder fouten en de
# gegenereerde pagina's in de repo komen overeen met tools/.
# (Vervangt de standaard Python-template: die draaide pytest, maar deze repo
# heeft geen tests, dus faalde elke run met exit code 5.)

name: Site check

on:
  push:
    branches: [ "main", "website-relaunch-nl-v1" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Lint (alleen syntaxfouten en ongedefinieerde namen)
      run: |
        python -m pip install --upgrade pip flake8
        flake8 tools --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Site bouwen
      run: python3 tools/build.py
    - name: Gegenereerde pagina's zijn up-to-date
      run: git diff --exit-code -- nl en de 404.html index.html _redirects
